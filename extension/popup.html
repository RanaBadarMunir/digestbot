<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to DigestBot</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 340px; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
      main { padding: 14px; }
      .status { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
      .status.ok { color: var(--ok); }
      .status.dup { color: var(--muted); }
      .status.bad { color: var(--bad); }
      .page { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
      .page-title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
      .summary { margin-top: 8px; color: var(--muted); }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      .actions .btn { flex: 1; }
      .icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 8px; font-size: 16px; }
      .icon-btn:hover { color: var(--ink); background: var(--brand-soft); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><img src="icons/icon-48.png" alt="" />DigestBot</div>
      <button class="icon-btn" id="settings" title="Extension settings" aria-label="Extension settings">⚙</button>
    </header>
    <main id="view" aria-live="polite"></main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
